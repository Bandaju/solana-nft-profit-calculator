<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Structure Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Site Structure Analyzer</h1>
            <p class="subtitle">Web sitelerinin tasarım ve yapısını analiz edin</p>
        </header>

        <main>
            <div class="input-section">
                <div class="input-wrapper">
                    <input
                        type="url"
                        id="urlInput"
                        placeholder="https://example.com"
                        required
                    >
                    <button id="analyzeBtn" onclick="analyzeWebsite()">
                        <span class="btn-text">Analiz Et</span>
                        <span class="btn-loader" style="display: none;"></span>
                    </button>
                </div>
                <p class="hint">Analiz etmek istediğiniz web sitesinin tam URL'sini girin</p>
            </div>

            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <div id="resultsSection" class="results-section" style="display: none;">
                <div class="results-header">
                    <h2>Analiz Sonuçları</h2>
                    <div class="results-actions">
                        <button class="btn-secondary" onclick="copyJSON()">JSON Kopyala</button>
                        <button class="btn-secondary" onclick="downloadJSON()">JSON İndir</button>
                    </div>
                </div>

                <div class="tabs">
                    <button class="tab active" data-tab="overview" onclick="switchTab('overview')">Genel Bakış</button>
                    <button class="tab" data-tab="structure" onclick="switchTab('structure')">Yapı</button>
                    <button class="tab" data-tab="design" onclick="switchTab('design')">Tasarım</button>
                    <button class="tab" data-tab="seo" onclick="switchTab('seo')">SEO</button>
                    <button class="tab" data-tab="json" onclick="switchTab('json')">JSON</button>
                </div>

                <div id="tabContent" class="tab-content">
                    <!-- Tab içerikleri JavaScript ile doldurulacak -->
                </div>
            </div>
        </main>

        <footer>
            <p>Site Structure Analyzer &copy; 2025</p>
        </footer>
    </div>

    <script src="analyzer.js"></script>
</body>
</html>
